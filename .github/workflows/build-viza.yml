name: Build APK Viza

# Build APK white-label Viza langsung di GitHub Actions.
# Hasil: artifact APK + release otomatis bertanda viza-1.0.<nomor build>.
on:
  workflow_dispatch:
    inputs:
      nama_app:
        description: "Nama aplikasi (label ikon)"
        default: "Viza Chat"
        required: true
      paket:
        description: "applicationId"
        default: "com.vizachatvoice.app"
        required: true
      nomor_build:
        description: "Nomor build (jadi versi 1.0.N). Kosongkan untuk memakai nomor run."
        default: ""
        required: false
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tools/**"
      - "firebase/google-services.json"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-viza.yml"

concurrency:
  group: build-viza-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RTDB_URL: "https://my-app-e7f8c-default-rtdb.asia-southeast1.firebasedatabase.app"
      GOOGLE_WEB_ID: "622104139221-bv44lfoephrjvim5qr30qr3ek8klj6qg.apps.googleusercontent.com"
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Pasang platform dan build-tools
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;34.0.0" > /dev/null
          echo "$ANDROID_HOME" >> "$GITHUB_PATH"

      - name: Siapkan Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Tulis kunci rilis dari secret
        env:
          VIZA_KEYSTORE_BASE64: ${{ secrets.VIZA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$VIZA_KEYSTORE_BASE64" ]; then
            echo "Secret VIZA_KEYSTORE_BASE64 belum diisi." >&2
            exit 1
          fi
          echo "$VIZA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/viza-release.jks"
          ls -l "$RUNNER_TEMP/viza-release.jks"

      - name: Build APK
        env:
          VIZA_KEYSTORE: ${{ runner.temp }}/viza-release.jks
          VIZA_STORE_PASS: ${{ secrets.VIZA_STORE_PASS }}
          VIZA_KEY_ALIAS: ${{ secrets.VIZA_KEY_ALIAS }}
          GRADLE_BIN: gradle
          KERJA: ${{ runner.temp }}/kerja
        run: |
          NAMA="${{ github.event.inputs.nama_app || 'Viza Chat' }}"
          PAKET="${{ github.event.inputs.paket || 'com.vizachatvoice.app' }}"
          NOMOR="${{ github.event.inputs.nomor_build }}"
          if [ -z "$NOMOR" ]; then NOMOR="${{ github.run_number }}"; fi
          export REZO_BUILD="$NOMOR"
          bash tools/build-whitelabel.sh firebase/google-services.json "$NAMA" "$PAKET" "$NAMA" "$RTDB_URL" "$GOOGLE_WEB_ID"
          APK="$KERJA/vizachat/app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          ls -l "$APK"
          cp "$APK" "$RUNNER_TEMP/viza-chat-arm64.apk"
          cd "$RUNNER_TEMP" && zip -q viza-chat-arm64.zip viza-chat-arm64.apk
          echo "VERSI=1.0.$NOMOR" >> "$GITHUB_ENV"

      - name: Simpan artifact
        uses: actions/upload-artifact@v4
        with:
          name: viza-chat-arm64-${{ env.VERSI }}
          path: ${{ runner.temp }}/viza-chat-arm64.zip
          retention-days: 30

      - name: Terbitkan release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="viza-${VERSI}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/viza-chat-arm64.zip" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/viza-chat-arm64.zip" \
              --title "Viza Chat ${VERSI}" \
              --notes "APK arm64 hasil build otomatis (commit ${{ github.sha }}). Paket com.vizachatvoice.app, ditandatangani kunci rilis Viza." \
              --latest
          fi
