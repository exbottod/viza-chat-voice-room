  <body style="height:100%;margin:0">
    <div id="root"></div>
    <div id="cf-error"></div>
    <div id="cf-info">html…</div>
    <script>
      (function () {
        var v = (navigator.userAgent.match(/Chrome\/(\d+)/) || [])[1] || "?";
        document.getElementById("cf-info").textContent = "html ok · cr" + v;
        window.addEventListener("load", function () {
          document.getElementById("cf-info").textContent = "load ok · cr" + v;
        });
        // Diagnosa: kalau React tidak mengisi apa pun, tampilkan keadaannya.
        setTimeout(function () {
          try {
            var r = document.getElementById("root");
            var anak = r ? r.children.length : -1;
            var tinggi = r ? Math.round(r.getBoundingClientRect().height) : -1;
            var anak1 = r && r.firstElementChild ? Math.round(r.firstElementChild.getBoundingClientRect().height) : -1;
            var teks = "ok · cr" + v + " · anak" + anak + " · h" + tinggi + " · a1:" + anak1 +
              " · css" + document.styleSheets.length + " · " + window.innerWidth + "x" + window.innerHeight;
            document.getElementById("cf-info").textContent = teks;
            if (anak < 1 || tinggi < 80) tampil("Layar kosong (" + teks + ")");
          } catch (err) {}
        }, 4000);
      })();
    </script>
    <script>
      (function () {
        var box = document.getElementById("cf-error");
        function tampil(teks) {
          try {
            box.style.display = "block";
            box.textContent = String(teks).slice(0, 900);
          } catch (e) {}
        }
        window.addEventListener("error", function (e) {
          var t = e.target;
          // Galat gambar/font tidak bikin layar kosong, jadi tidak perlu ditampilkan.
          if (t && t !== window && t.tagName && t.tagName.toUpperCase() !== "SCRIPT") return;
          tampil("Error: " + (e.message || (t && t.src) || e.type));
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          tampil("Gagal: " + ((e.reason && (e.reason.message || e.reason)) || "unknown"));
        });
        window.__cfTampilError = tampil;
      })();
    </script>
      <script>
      // Paksa tinggi nyata (piksel) ke html, body, #root dan anak-anaknya.
      // Persen/100vh bisa dinilai 0 di WebView tertentu; piksel dari
      // window.innerHeight selalu benar (layar terbaca 399x822).
      (function () {
        function tinggi() {
          var h = window.innerHeight || document.documentElement.clientHeight || 0;
          if (h < 120) h = screen.height || 0;
          return h;
        }
        function pasang(el, v) {
          if (!el || !el.style) return;
          if (el.style.getPropertyValue("height") !== v) {
            el.style.setProperty("height", v, "important");
            el.style.setProperty("min-height", v, "important");
            el.style.setProperty("max-height", v, "important");
          }
        }
        function jalan() {
          var h = tinggi();
          if (!h) return;
          var v = h + "px";
          pasang(document.documentElement, v);
          pasang(document.body, v);
          var root = document.getElementById("root");
          pasang(root, v);
          var a1 = root && root.firstElementChild;
          pasang(a1, v);
          var a2 = a1 && a1.firstElementChild;
          pasang(a2, v);
          var info = document.getElementById("cf-info");
          if (info) {
            info.textContent = "fix " + window.innerWidth + "x" + h +
              " · root" + (root ? Math.round(root.getBoundingClientRect().height) : -1) +
              " · a1" + (a1 ? Math.round(a1.getBoundingClientRect().height) : -1) +
              " · a2" + (a2 ? Math.round(a2.getBoundingClientRect().height) : -1);
          }
        }
        var n = 0;
        var t = setInterval(function () { try { jalan(); } catch (e) {} if (++n > 60) clearInterval(t); }, 200);
        window.addEventListener("resize", function () { try { jalan(); } catch (e) {} });
        window.addEventListener("load", function () { try { jalan(); } catch (e) {} });
        try { jalan(); } catch (e) {}
      })();
    </script>
