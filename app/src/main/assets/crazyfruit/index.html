<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Crazy Fruit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Orbitron:wght@700;900&display=swap" />
    <style>
      html, body, #root { height: 100%; margin: 0; padding: 0; background: #0a0f1e; overflow: hidden; }
      #cf-info { position: fixed; left: 6px; bottom: 2px; z-index: 99998; color: #8fa3cc;
        font: 9px/1.2 monospace; opacity: .75; pointer-events: none; }
      #cf-error { display: none; position: fixed; inset-inline: 0; bottom: 0; z-index: 99999;
        background: #7a1020; color: #fff; font: 12px/1.35 sans-serif; padding: 10px 12px;
        max-height: 45%; overflow: auto; white-space: pre-wrap; word-break: break-word; }
    </style>
    <script defer src="./assets/index-BDfG_CTQ.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <div id="cf-error"></div>
    <div id="cf-info">html…</div>
    <script>
      (function () {
        var v = (navigator.userAgent.match(/Chrome\/(\d+)/) || [])[1] || "?";
        document.getElementById("cf-info").textContent = "html ok · cr" + v;
        window.addEventListener("load", function () {
          document.getElementById("cf-info").textContent = "load ok · cr" + v;
        });
        // Diagnosa: kalau React tidak mengisi apa pun, tampilkan keadaannya.
        setTimeout(function () {
          try {
            var r = document.getElementById("root");
            var anak = r ? r.children.length : -1;
            var tinggi = r ? Math.round(r.getBoundingClientRect().height) : -1;
            var teks = "ok · cr" + v + " · anak" + anak + " · h" + tinggi +
              " · " + window.innerWidth + "x" + window.innerHeight;
            document.getElementById("cf-info").textContent = teks;
            if (anak < 1 || tinggi < 80) tampil("Layar kosong (" + teks + ")");
          } catch (err) {}
        }, 4000);
      })();
    </script>
    <script>
      (function () {
        var box = document.getElementById("cf-error");
        function tampil(teks) {
          try {
            box.style.display = "block";
            box.textContent = String(teks).slice(0, 900);
          } catch (e) {}
        }
        window.addEventListener("error", function (e) {
          tampil("Error: " + (e.message || (e.target && e.target.src) || e.type));
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          tampil("Gagal: " + ((e.reason && (e.reason.message || e.reason)) || "unknown"));
        });
        window.__cfTampilError = tampil;
      })();
    </script>
  </body>
</html>
