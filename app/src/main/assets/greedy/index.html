<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./assets/images/icon.png" />
    <link rel="apple-touch-icon" href="./assets/images/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#C0392B" />
    <title>Greedy King</title>
    <script>
      // Di WebView Android, 100dvh/100vh kadang bernilai 0 sehingga seluruh isi
      // game tingginya nol dan yang terlihat hanya latar kuning. Tinggi layar
      // nyata dipasang langsung sebagai piksel.
      (function () {
        function paksa(el, h) {
          if (!el || !el.style) return;
          // Gaya inline dengan !important tidak bisa dikalahkan berkas CSS mana pun,
          // termasuk CSS game yang dimuat setelah skrip ini.
          el.style.setProperty("height", h + "px", "important");
          el.style.setProperty("min-height", h + "px", "important");
          el.style.setProperty("max-height", "none", "important");
          el.style.setProperty("display", "block", "important");
          el.style.setProperty("visibility", "visible", "important");
          el.style.setProperty("opacity", "1", "important");
        }
        function pasang() {
          var h = window.innerHeight || document.documentElement.clientHeight || 0;
          try { if (h < 100 && window.RezoBridge && window.RezoBridge.tinggi) h = Number(window.RezoBridge.tinggi()) || 0; } catch (e) {}
          if (h < 100) h = screen.height || 0;
          if (h < 100) return;
          paksa(document.documentElement, h);
          paksa(document.body, h);
          var akar = document.getElementById("root");
          paksa(akar, h);
          if (akar) {
            for (var i = 0; i < akar.children.length; i++) paksa(akar.children[i], h);
          }
          var st = document.getElementById("gkTinggi");
          if (!st) {
            st = document.createElement("style");
            st.id = "gkTinggi";
            (document.head || document.documentElement).appendChild(st);
          }
          st.textContent =
            "html,body,#root{height:" + h + "px!important;min-height:" + h + "px!important}" +
            "#root>*,body>div{height:" + h + "px!important;min-height:" + h + "px!important}" +
            ".h-dvh,.h-svh,.h-screen{height:" + h + "px!important}" +
            ".min-h-dvh,.min-h-svh,.min-h-screen{min-height:" + h + "px!important}";
        }
        pasang();
        // Ulangi beberapa detik pertama: React memasang isi setelah skrip ini jalan.
        var n = 0;
        var ulang = setInterval(function () { pasang(); if (++n > 60) clearInterval(ulang); }, 150);
        try {
          new MutationObserver(pasang).observe(document.documentElement, { childList: true, subtree: true });
        } catch (e) {}
        window.addEventListener("resize", pasang);
        window.addEventListener("orientationchange", pasang);
        document.addEventListener("DOMContentLoaded", pasang);
        window.addEventListener("load", pasang);
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-DYdSTxI1.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C6zMQ3Ai.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
