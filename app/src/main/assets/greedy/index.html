<script>
(function(){
  // Tinggi layar nyata dalam piksel. Dipasang langsung ke html, body, #root
  // dan pembungkus game, karena di sebagian WebView 100dvh bernilai 0 sehingga
  // seluruh isi game tingginya nol dan yang terlihat cuma latar kuning.
  function tinggi(){
    var h = window.innerHeight || document.documentElement.clientHeight || screen.height || 0;
    if (h < 100) return;
    var px = h + "px";
    var d = document.documentElement, b = document.body;
    d.style.setProperty("--gk-h", px);
    d.style.height = px;
    if (b) { b.style.height = px; b.style.minHeight = px; }
    var r = document.getElementById("root");
    if (r) { r.style.height = px; r.style.minHeight = px; }
    var iso = document.querySelectorAll(".h-dvh,.min-h-dvh");
    for (var i = 0; i < iso.length; i++) {
      iso[i].style.height = px; iso[i].style.minHeight = px;
    }
  }
  tinggi();
  window.addEventListener("resize", tinggi);
  window.addEventListener("orientationchange", tinggi);
  document.addEventListener("DOMContentLoaded", tinggi);
  // React menggambar belakangan, jadi diulang sampai elemennya ada.
  var n = 0;
  var ulang = setInterval(function(){ tinggi(); if (++n > 80) clearInterval(ulang); }, 150);
  var mo = new MutationObserver(tinggi);
  document.addEventListener("DOMContentLoaded", function(){
    var r = document.getElementById("root");
    if (r) mo.observe(r, {childList:true, subtree:true});
  });
})();
</script>

<script>
(function () {
  var b = window.RezoBridge;
  function ambil(fn) { try { return b && b[fn] ? b[fn]() : ""; } catch (e) { return ""; } }
  // Parameter di alamat adalah sumber utama; jembatan RezoBridge hanya cadangan.
  // Dulu token dari jembatan bisa kosong sehingga server menolak sesi.
  var q = {};
  try {
    (location.search || "").replace(/^\?/, "").split("&").forEach(function (pasangan) {
      if (!pasangan) return;
      var i = pasangan.indexOf("=");
      var k = i < 0 ? pasangan : pasangan.slice(0, i);
      var v = i < 0 ? "" : pasangan.slice(i + 1);
      q[decodeURIComponent(k)] = decodeURIComponent(v);
    });
  } catch (e) {}
  window.__GREEDY_API__ = "https://GANTI-SERVER-ANDA/greedy";
  window.__GREEDY_TOKEN__ = q.t || ambil("token") || window.__GREEDY_TOKEN__ || "";
  var uid = q.u || ambil("uid"), nama = q.n || ambil("nama");
  if (uid) window.__GREEDY_USER__ = { id: String(uid), name: String(nama || "Player") };
  var chip = ambil("chips"); if (chip) { try { window.__GREEDY_CHIPS__ = JSON.parse(chip); } catch (e) {} }
})();
</script>
<script>
(function(){
  // Permintaan ke server dompet dikerjakan app lewat jembatan Android, karena
  // di sebagian HP permintaan dari halaman lokal tidak pernah sampai. Jawaban
  // dikirim balik tanpa menunggu, supaya animasi loading tetap berjalan.
  var asli = window.fetch;
  var DASAR = "https://GANTI-SERVER-ANDA";
  var urut = 0;
  var tunggu = {};
  window.__gkBalas = function (id, teks) {
    var selesai = tunggu[id];
    delete tunggu[id];
    if (selesai) selesai(teks);
  };
  window.fetch = function (alamat, opsi) {
    try {
      var url = typeof alamat === "string" ? alamat : (alamat && alamat.url) || "";
      var jembatan = window.RezoBridge;
      // Kalau halaman ini sudah dilayani dari server yang sama, pakai jalur
      // biasa; jembatan hanya dipakai untuk halaman yang dibuka dari dalam APK.
      var sesamaAsal = location.host && DASAR.indexOf(location.host) > -1;
      if (!sesamaAsal && url.indexOf(DASAR) === 0 && jembatan && jembatan.mintaAsync) {
        var metode = (opsi && opsi.method) || "GET";
        var isi = (opsi && opsi.body) ? String(opsi.body) : "";
        var jalur = url.slice(DASAR.length) || "/";
        return new Promise(function (selesai) {
          var id = String(++urut);
          tunggu[id] = function (teks) {
            selesai(new Response(teks || "{}", {
              status: 200,
              headers: { "Content-Type": "application/json" }
            }));
          };
          try {
            jembatan.mintaAsync(id, metode, jalur, isi);
          } catch (e) {
            delete tunggu[id];
            selesai(new Response('{"ok":0,"error":"jembatan gagal"}', { status: 200 }));
          }
        });
      }
    } catch (e) { }
    return asli.apply(this, arguments);
  };
})();
</script>

<script>
(function () {

  var makanan = ["cabbage","carrot","corn","drumstick","hotdog","pizza","salad","skewer","steak","tomato"];

<script>
(function () {
  var msg = document.getElementById("bootmsg");
  var box = document.getElementById("booterr");
  window.__reactJalan = false;
  function tampilErr(t) {
    if (!box) return;
    box.style.display = "block";
    box.textContent = String(t).slice(0, 600);
  }
  window.__bootErr = tampilErr;
  // Layar muat hanya dicabut kalau game benar-benar sudah menggambar sesuatu.
  // Kalau dicabut terlalu cepat, layar jadi kuning kosong tanpa penjelasan.
  window.__bootSelesai = function () {
    var b = document.getElementById("boot");
    if (b) b.remove();
  };
  // Begitu game menggambar apa pun, layar muat dicabut sendiri. Jangan menunggu
  // panggilan dari dalam game, karena kalau game berhenti, layar muat menutupi
  // pesan aslinya dan yang terlihat cuma kuning.
  // Game dianggap benar-benar tampil hanya kalau ada kotak yang terlihat.
  // Kalau React sempat menempel tapi isinya kosong, layar muat DIBIARKAN,
  // supaya tidak pernah lagi jadi kuning polos tanpa tulisan.
  function sudahTampil() {
    var r = document.getElementById("root");
    if (!r) return false;
    // Dianggap tampil hanya kalau ada isi nyata: tulisan, gambar, atau kanvas.
    // Kotak kosong berukuran besar tidak dihitung, supaya layar tidak pernah
    // berubah jadi kuning polos tanpa tulisan.
    if ((r.innerText || "").trim().length > 15) return true;
    var nyata = r.querySelectorAll("canvas,img,svg,button");
    for (var i = 0; i < nyata.length; i++) {
      var q = nyata[i].getBoundingClientRect();
      if (q.width > 24 && q.height > 24) return true;
    }
    return false;
  }
  var cek = setInterval(function () {
    if (sudahTampil()) {
      clearInterval(cek);
      window.__gkSudahTampil = true;
      var b = document.getElementById("boot");
      if (b) b.remove();
    }
  }, 300);
  window.onerror = function (m, src, l, c, e) {
    tampilErr("Error: " + m + "\n" + (src || "") + ":" + (l || 0) + "\n" + ((e && e.stack) || ""));
  };
  window.addEventListener("unhandledrejection", function (ev) {
    var r = ev.reason;
    tampilErr("Gagal: " + ((r && (r.message || r)) || "tidak diketahui"));
  });
  setTimeout(function () {
    if (!window.__reactJalan && msg) msg.textContent = "Masih memuat kode game... (" + location.host + ")";
  }, 4000);
  setTimeout(function () {
    if (!window.__reactJalan && msg) msg.textContent = "Kode game belum jalan. Halaman: " + location.href.slice(0, 90);
  }, 10000);
  // Jaring pengaman terakhir: kalau sampai 8 detik game belum menggambar,
  // tampilkan sebabnya, jangan biarkan layar kuning tanpa penjelasan.
  setTimeout(function () {
    if (!window.__gkSudahTampil && window.__gkSebab) { try { window.__gkSebab(""); } catch (e) {} }
  }, 8000);
})();
</script>

<script>
(function () {
  var panel = document.getElementById("gksebab");
  var isi = document.getElementById("gksebabisi");
  var pesanAkhir = "";
  function catat(t) { pesanAkhir = String(t || "").slice(0, 400); }
  window.addEventListener("error", function (e) { catat("Error: " + (e.message || "") ); });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason; catat("Gagal: " + ((r && (r.message || r)) || "tidak diketahui"));
  });
  function tampilSebab(asli) {
    var b = window.RezoBridge;
    function ambil(fn) { try { return b && b[fn] ? b[fn]() : null; } catch (e) { return "gagal"; } }
    var uid = ambil("uid"), tok = ambil("token");
    var baris = [
      "Penyebab: " + (asli || pesanAkhir || "kode game berhenti tanpa pesan"),
      "",
      "Alamat halaman: " + location.href.slice(0, 90),
      "Jembatan app (RezoBridge): " + (b ? "ada" : "tidak ada"),
      "ID pemain: " + (uid ? "ada (" + String(uid).slice(0, 12) + ")" : "kosong"),
      "Token: " + (tok ? "ada (" + String(tok).length + " huruf)" : "kosong"),
      "Isi layar: " + (document.getElementById("root") ? document.getElementById("root").children.length + " bagian" : "tidak ada"),
    ];
    isi.textContent = baris.join("\n");
    panel.style.display = "block";
    var boot = document.getElementById("boot");
    if (boot) boot.remove();
  }
  window.__gkSebab = tampilSebab;
  document.getElementById("gkcobaLagi").onclick = function () { location.reload(); };
  // Kalau game tidak menggambar apa pun, tampilkan penyebabnya, bukan layar kuning kosong.
  setTimeout(function () {
    if (!window.__gkSudahTampil) {
      tampilSebab(pesanAkhir || "kode game berhenti sebelum menggambar apa pun (12 detik)");
    }
  }, 12000);
})();
</script>
